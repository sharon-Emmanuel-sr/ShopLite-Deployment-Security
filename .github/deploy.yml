name: Production Deployment
on:
  push:
    branches: [ main ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Dependencies
        run: npm install
      - name: Build with Secrets
        run: npm run build
        env:
          # This injections the secret into the environment safely
          DB_URL: ${{ secrets.PROD_DB_URL }}
          NODE_ENV: production